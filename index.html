<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト給与計算（月別カレンダー）</title>
<style>
  :root{
    --card:#fff; --accent:#ff6b6b; --accent2:#4dabf7;
    --text:#2b2d42; --sub:#6b7280; --line:#e5e9f0; --good:#37b24d; --inc:#f59f00;
    --sun:#fff0f0; --sat:#eef4ff; --sunT:#e03131; --satT:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);
    background:linear-gradient(160deg,#eef2fb,#fce9ec);min-height:100vh;padding:18px 12px;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:1.35rem;text-align:center;margin-bottom:4px}
  .lead{text-align:center;color:var(--sub);font-size:.8rem;margin-bottom:14px}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(40,50,90,.08);margin-bottom:16px}

  .field label{display:block;font-weight:600;font-size:.8rem;margin-bottom:5px}
  .field .sub{color:var(--sub);font-weight:400;font-size:.72rem}
  input[type=number],input[type=text],input[type=time]{
    padding:9px 11px;font-size:.92rem;border:2px solid var(--line);border-radius:10px;background:#fbfcfe;-moz-appearance:textfield;
  }
  input:focus{outline:none;border-color:var(--accent2)}
  select{padding:9px 11px;font-size:.92rem;border:2px solid var(--line);border-radius:10px;background:#fbfcfe}
  .yearBox{width:96px;font-weight:800;font-size:1.05rem;text-align:center}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--sub);padding:9px 16px;border-radius:12px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .tab.addTab{color:var(--accent);border-color:var(--accent);border-style:dashed}
  .tab.allTab.on{background:#3b82f6;border-color:#3b82f6}

  .page{display:none}.page.active{display:block}

  .seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:9px 16px;font-size:.9rem;cursor:pointer;font-weight:600;color:var(--sub)}
  .seg button.on{background:var(--accent2);color:#fff}

  .staffHead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
  .staffHead .nameInp{width:170px;font-weight:800;font-size:1.05rem}
  .staffHead .delStaff{margin-left:auto;border:0;background:#fff0f0;color:var(--accent);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.8rem}
  .staffSettings{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;background:#f8faff;border-radius:12px;padding:14px;margin-bottom:14px}
  .wageBox{width:110px}.depBox{width:66px}.ptBox{width:76px}

  /* 月セレクタ */
  .monthTabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .mTab{border:2px solid var(--line);background:#fff;color:var(--sub);padding:8px 16px;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer}
  .mTab.on{background:linear-gradient(135deg,#4dabf7,#3b82f6);border-color:#3b82f6;color:#fff}
  .addMonthWrap{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
  .addMonthBtn{border:2px dashed var(--accent2);color:var(--accent2);background:#fff;padding:7px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.8rem}
  .monthSel{padding:7px 10px}

  .monthBlock{display:none}
  .monthBlock.active{display:block}
  .calCap{display:flex;align-items:center;gap:10px;margin:10px 0}
  .calCap .capTitle{font-size:1.25rem;font-weight:800}
  .calCap .capYear{color:var(--sub);font-size:.85rem}
  .calCap .delMonth{margin-left:auto;border:0;background:#fff0f0;color:var(--accent);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.76rem;font-weight:600}

  .calWrap{overflow-x:auto}
  .calTbl{border-collapse:collapse;width:100%;min-width:500px;font-size:.86rem}
  .calTbl th{background:#fafbfe;color:var(--sub);font-size:.72rem;font-weight:700;padding:7px 6px;border-bottom:1px solid var(--line)}
  .calTbl td{padding:5px 6px;border-bottom:1px solid #f0f2f7;text-align:center}
  .calTbl .dnum{font-weight:700;width:34px}
  .calTbl .dow{width:30px;font-weight:700;color:var(--sub)}
  .calTbl input[type=time]{width:104px;padding:6px 8px}
  .calTbl .dbrk{width:80px;padding:6px 6px}
  .calTbl .dwork{font-weight:700;min-width:70px;text-align:right}
  .calTbl .dstat{width:56px;font-weight:800}
  .calTbl .dpen{width:20px;height:20px;cursor:pointer;accent-color:var(--accent)}
  tr.sun{background:var(--sun)}tr.sun .dow{color:var(--sunT)}
  tr.sat{background:var(--sat)}tr.sat .dow{color:var(--satT)}
  tr.worked{background:#effaf1 !important;box-shadow:inset 4px 0 0 var(--good)}
  tr.worked .dstat{color:var(--good)}
  tr.penalty{background:#fff0f0 !important;box-shadow:inset 4px 0 0 var(--accent)}
  tr.penalty .dstat{color:var(--accent)}
  tr.penalty input[type=time],tr.penalty .dbrk{opacity:.45}
  .payGrid .pen b{color:#ffd0d0}

  /* お給料カード */
  .payout{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff;border-radius:16px;padding:18px;margin-top:16px}
  .payout .payTop{text-align:center;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:12px;margin-bottom:12px}
  .payout .payTop span{font-size:.85rem;opacity:.95}
  .payout .payBig{font-size:2.5rem;font-weight:800;letter-spacing:-1px;margin-top:4px}
  .payGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .payGrid .cell{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
  .payGrid .cell span{display:block;font-size:.72rem;opacity:.9;margin-bottom:3px}
  .payGrid .cell b{font-size:1.1rem}
  .payGrid .tax b{color:#ffe08a}

  .addStaff{border:2px dashed var(--accent);color:var(--accent);background:#fff;padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:.92rem;width:100%}
  .total{background:linear-gradient(135deg,#4dabf7,#3b82f6);color:#fff}
  .total h3{font-size:1.05rem;margin-bottom:12px}
  .grandTbl{width:100%;min-width:600px;border-collapse:collapse;font-size:.85rem}
  .grandTbl th,.grandTbl td{padding:8px;text-align:right;white-space:nowrap}
  .grandTbl th:first-child,.grandTbl td:first-child{text-align:left}
  .grandTbl th{color:rgba(255,255,255,.85);font-size:.72rem}
  .grandTbl td{border-bottom:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700}
  .grandTbl .inc{color:#ffe08a}.grandTbl .empty{opacity:.85;text-align:center}

  .saveRow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
  .resetBtn{border:1px solid var(--line);background:#fff;color:var(--sub);padding:7px 12px;border-radius:9px;font-size:.76rem;cursor:pointer}
  footer{color:var(--sub);font-size:.72rem;margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗓️ シフト給与計算</h1>
  <p class="lead">上で月を選ぶとその月だけ表示。働いた日の出勤・退勤・休憩を入れると、下にお給料が出ます</p>

  <div class="card">
    <div class="field">
      <label>対象の年 <span class="sub">この年で月を追加</span></label>
      <input class="yearBox" type="number" id="year" value="2026" min="2000" max="2100" step="1">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="pages">
    <div class="page" data-id="all">
      <div class="card total">
        <h3>📊 月別 全体合計（全スタッフ）</h3>
        <div class="calWrap">
          <table class="grandTbl">
            <thead><tr>
              <th>月</th><th>実働</th><th>基本給</th><th>インセンティブ</th><th>支給総額</th><th>源泉所得税</th><th>差引支給額</th>
            </tr></thead>
            <tbody id="grandBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <button class="addStaff" id="addStaff">＋ スタッフ（ページ）を追加</button>
  <div class="saveRow">
    <span id="saveMsg" style="color:var(--good);font-size:.76rem">💾 入力内容はこの端末のブラウザに自動保存され、次回も続きから使えます。</span>
    <button class="resetBtn" id="resetBtn">保存データを消去</button>
  </div>

  <footer>
    ※ 実働 = 退勤 − 出勤 − 休憩。インセンティブ = 実働時間 × 獲得ポイント × 100円。<br>
    ※ 源泉所得税は令和6年分「電子計算機特例」に基づく<b>概算</b>（社保控除は未考慮）。甲欄＝申告書提出者／乙欄＝未提出者(×3.063%)。<br>
    ※ 正確な税額・手取りは税理士・給与ソフトでご確認ください。
  </footer>
</div>

<script>
  const WD=["日","月","火","水","木","金","土"];
  const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
  let seq=0;

  function hmText(min){ if(min<=0)return"0分"; const h=Math.floor(min/60),m=min%60; return (h?h+"時間":"")+(m?m+"分":(h?"":"0分")); }
  function calcMin(inp,out,brk){
    if(!inp||!out) return 0;
    const [ih,im]=inp.split(":").map(Number), [oh,om]=out.split(":").map(Number);
    let d=(oh*60+om)-(ih*60+im); if(d<0) d+=1440;
    return Math.max(d-(+brk||0),0);
  }
  const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
  function fmtYM(ym){ const [y,m]=ym.split("-"); return `${y}年${+m}月`; }

  function withholding(gross,mode,dep){
    const A=Math.floor(gross);
    if(mode==="otsu") return Math.round(A*0.03063);
    if(A<=88000) return 0;
    let k; if(A<=135416)k=45834; else if(A<=149999)k=A*0.4-8333; else if(A<=299999)k=A*0.3+6667;
    else if(A<=549999)k=A*0.2+36667; else if(A<=708330)k=A*0.1+91667; else k=195834;
    let B=A-k-40000-31667*(+dep||0); if(B<=0) return 0;
    let t; if(B<=162500)t=B*0.05105; else if(B<=275000)t=B*0.1021-8296; else if(B<=579166)t=B*0.2042-36374; else t=B*0.23483-54113;
    return Math.round(t/10)*10;
  }

  const pages=document.getElementById("pages");
  const tabsEl=document.getElementById("tabs");
  const allPage=pages.querySelector('.page[data-id="all"]');
  const yearInput=document.getElementById("year");

  function staffPage(name="",wage=1300,mode="kou",dep=0,pt=0){
    const id="s"+(++seq);
    const page=document.createElement("div");
    page.className="page"; page.dataset.id=id; page.dataset.mode=mode;
    page.innerHTML=`
      <div class="card">
        <div class="staffHead">
          <input class="nameInp" type="text" placeholder="スタッフ名" value="${name}">
          <button class="delStaff">このスタッフを削除</button>
        </div>
        <div class="staffSettings">
          <div class="field"><label>基本時給 <span class="sub">円</span></label>
            <input class="wageBox wage" type="number" min="0" step="10" value="${wage}"></div>
          <div class="field"><label>税区分</label>
            <div class="seg">
              <button type="button" data-k="kou" class="${mode==='kou'?'on':''}">甲欄</button>
              <button type="button" data-k="otsu" class="${mode==='otsu'?'on':''}">乙欄</button>
            </div></div>
          <div class="field depField" style="opacity:${mode==='kou'?1:.4}"><label>扶養親族等の数</label>
            <input class="depBox dep" type="number" min="0" step="1" value="${dep}"></div>
          <div class="field"><label>獲得ポイント <span class="sub">1pt=100円/時</span></label>
            <input class="ptBox pt" type="number" min="0" step="1" value="${pt}"></div>
        </div>
        <div class="monthTabs">
          <div class="addMonthWrap">
            <select class="monthSel">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join("")}</select>
            <button class="addMonthBtn" type="button">＋ 月を追加</button>
          </div>
        </div>
        <div class="months"></div>
      </div>`;
    pages.insertBefore(page,allPage);
    return page;
  }

  function brkSelect(val){
    const opts=[["0","なし"],["45","45分"],["90","90分"]];
    const sel=(val===undefined||val==="")?"45":String(val);
    return `<select class="dbrk">${opts.map(([v,l])=>`<option value="${v}"${v===sel?" selected":""}>${l}</option>`).join("")}</select>`;
  }
  function dayRows(year,month,days){
    const n=daysInMonth(year,month); let h="";
    for(let d=1;d<=n;d++){
      const dow=new Date(year,month-1,d).getDay();
      const cls=dow===0?"sun":(dow===6?"sat":"");
      const v=(days&&days[d])||{};
      h+=`<tr class="dayrow ${cls}" data-day="${d}">
        <td class="dnum">${d}</td><td class="dow">${WD[dow]}</td>
        <td><input type="time" class="din" value="${v.i||""}"></td>
        <td><input type="time" class="dout" value="${v.o||""}"></td>
        <td>${brkSelect(v.b)}</td>
        <td class="dwork">–</td>
        <td><input type="checkbox" class="dpen"${v.p?" checked":""}></td></tr>`;
    }
    return h;
  }

  function addMonth(page,year,month,days){
    const ym=`${year}-${String(month).padStart(2,"0")}`;
    if(page.querySelector(`.monthBlock[data-ym="${ym}"]`)) return null;
    const block=document.createElement("div");
    block.className="monthBlock"; block.dataset.ym=ym;
    block.innerHTML=`
      <div class="calCap">
        <span class="capTitle">${month}月</span><span class="capYear">${year}年</span>
        <button class="delMonth" type="button">この月を削除</button>
      </div>
      <div class="calWrap">
        <table class="calTbl">
          <thead><tr><th>日</th><th>曜</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>休み</th></tr></thead>
          <tbody>${dayRows(year,month,days)}</tbody>
        </table>
      </div>
      <div class="payout">
        <div class="payTop"><span>お給料（差引支給額）</span><div class="payBig m-net">¥0</div></div>
        <div class="payGrid">
          <div class="cell"><span>実働時間</span><b class="m-hours">0分</b></div>
          <div class="cell"><span>基本給</span><b class="m-base">¥0</b></div>
          <div class="cell"><span>インセンティブ</span><b class="m-inc">¥0</b></div>
          <div class="cell"><span>出勤日数</span><b class="m-days">0日</b></div>
          <div class="cell pen"><span>休み</span><b class="m-pen">0日</b></div>
          <div class="cell"><span>支給総額</span><b class="m-gross">¥0</b></div>
          <div class="cell tax"><span>源泉所得税</span><b class="m-tax">¥0</b></div>
        </div>
      </div>`;
    const cont=page.querySelector(".months");
    const blocks=[...cont.querySelectorAll(".monthBlock")];
    const after=blocks.find(b=>b.dataset.ym>ym);
    cont.insertBefore(block, after||null);
    return block;
  }

  function renderMonthTabs(page){
    const bar=page.querySelector(".monthTabs");
    [...bar.querySelectorAll(".mTab")].forEach(t=>t.remove());
    const blocks=[...page.querySelectorAll(".monthBlock")];
    let active=page.dataset.activeYm;
    if(!blocks.some(b=>b.dataset.ym===active)) active=blocks[0]?blocks[0].dataset.ym:null;
    const addWrap=bar.querySelector(".addMonthWrap");
    blocks.forEach(b=>{
      const m=+b.dataset.ym.split("-")[1];
      const btn=document.createElement("button");
      btn.className="mTab"+(b.dataset.ym===active?" on":""); btn.type="button"; btn.dataset.ym=b.dataset.ym; btn.textContent=m+"月";
      bar.insertBefore(btn, addWrap);
    });
    setActiveMonth(page, active);
  }
  function setActiveMonth(page,ym){
    page.dataset.activeYm=ym||"";
    page.querySelectorAll(".monthBlock").forEach(b=>b.classList.toggle("active",b.dataset.ym===ym));
    page.querySelectorAll(".mTab").forEach(t=>t.classList.toggle("on",t.dataset.ym===ym));
  }

  function renderTabs(){
    tabsEl.innerHTML="";
    pages.querySelectorAll('.page[data-id^="s"]').forEach(pg=>{
      const b=document.createElement("button"); b.className="tab"; b.dataset.id=pg.dataset.id;
      b.textContent=pg.querySelector(".nameInp").value||"（無名）"; tabsEl.appendChild(b);
    });
    const add=document.createElement("button"); add.className="tab addTab"; add.dataset.id="__add"; add.textContent="＋ 追加"; tabsEl.appendChild(add);
    const all=document.createElement("button"); all.className="tab allTab"; all.dataset.id="all"; all.textContent="📊 全体"; tabsEl.appendChild(all);
    const active=pages.querySelector(".page.active"); highlight(active?active.dataset.id:null);
  }
  function highlight(id){ tabsEl.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.id===id)); }
  function showPage(id){ pages.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.dataset.id===id)); highlight(id); calc(); }

  function calc(){
    const grand={};
    pages.querySelectorAll('.page[data-id^="s"]').forEach(page=>{
      const wage=+page.querySelector(".wage").value||0;
      const mode=page.dataset.mode;
      const dep=+page.querySelector(".dep").value||0;
      const pt=+page.querySelector(".pt").value||0;
      page.querySelectorAll(".monthBlock").forEach(block=>{
        const ym=block.dataset.ym; let min=0,workDays=0,penDays=0;
        block.querySelectorAll(".dayrow").forEach(tr=>{
          const i=tr.querySelector(".din").value,o=tr.querySelector(".dout").value,b=tr.querySelector(".dbrk").value;
          const pen=tr.querySelector(".dpen").checked;
          const w=calcMin(i,o,b), worked=w>0;
          tr.querySelector(".dwork").textContent=(i&&o)?hmText(w):"–";
          tr.classList.toggle("worked",worked);
          tr.classList.toggle("penalty",pen&&!worked);
          if(worked) workDays++;
          else if(pen) penDays++;
          min+=w;
        });
        const hours=min/60, base=Math.round(wage*hours), inc=Math.round(hours*pt*100);
        const gross=base+inc, tax=withholding(gross,mode,dep), net=gross-tax;
        block.querySelector(".m-hours").textContent=hmText(min);
        block.querySelector(".m-base").textContent=yen(base);
        block.querySelector(".m-inc").textContent=yen(inc);
        block.querySelector(".m-days").textContent=workDays+"日";
        block.querySelector(".m-pen").textContent=penDays+"日";
        block.querySelector(".m-gross").textContent=yen(gross);
        block.querySelector(".m-tax").textContent=tax?"−"+yen(tax):"¥0";
        block.querySelector(".m-net").textContent=yen(net);
        const g=grand[ym]||(grand[ym]={min:0,base:0,inc:0,gross:0,tax:0,net:0});
        g.min+=min;g.base+=base;g.inc+=inc;g.gross+=gross;g.tax+=tax;g.net+=net;
      });
    });
    const gk=Object.keys(grand).sort();
    document.getElementById("grandBody").innerHTML = gk.length
      ? gk.map(k=>{const g=grand[k];return `<tr><td>${fmtYM(k)}</td><td>${hmText(g.min)}</td><td>${yen(g.base)}</td><td class="inc">${yen(g.inc)}</td><td>${yen(g.gross)}</td><td>${g.tax?"−"+yen(g.tax):"¥0"}</td><td>${yen(g.net)}</td></tr>`;}).join("")
      : `<tr><td class="empty" colspan="7">シフトを入力してください</td></tr>`;
    save();
  }

  // ---- 保存 ----
  const STORE_KEY="baitoKyuyoSim.v2";
  let restoring=false;
  function serialize(){
    const staff=[];
    pages.querySelectorAll('.page[data-id^="s"]').forEach(page=>{
      const months=[];
      page.querySelectorAll(".monthBlock").forEach(block=>{
        const days={};
        block.querySelectorAll(".dayrow").forEach(tr=>{
          const i=tr.querySelector(".din").value,o=tr.querySelector(".dout").value,b=tr.querySelector(".dbrk").value;
          const p=tr.querySelector(".dpen").checked;
          if(i||o||p) days[tr.dataset.day]={i,o,b,p:p?1:0};
        });
        months.push({ym:block.dataset.ym,days});
      });
      staff.push({name:page.querySelector(".nameInp").value,wage:page.querySelector(".wage").value,
        mode:page.dataset.mode,dep:page.querySelector(".dep").value,pt:page.querySelector(".pt").value,
        activeYm:page.dataset.activeYm||"",months});
    });
    const active=pages.querySelector(".page.active");
    return {year:yearInput.value,active:active?active.dataset.id:null,staff};
  }
  function save(){ if(restoring)return; try{localStorage.setItem(STORE_KEY,JSON.stringify(serialize()));
    const m=document.getElementById("saveMsg"); if(m){const t=new Date();m.textContent=`💾 自動保存しました（${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}）— 次回も続きから使えます`;}
  }catch(e){} }
  function load(){ try{const r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):null;}catch(e){return null;} }

  // ---- events ----
  tabsEl.addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(!t)return;
    if(t.dataset.id==="__add"){ createStaff(); return; } showPage(t.dataset.id); });
  pages.addEventListener("input",e=>{ if(e.target.classList.contains("nameInp")) renderTabs(); calc(); });
  pages.addEventListener("change",e=>{ calc(); });
  window.addEventListener("beforeunload",save);
  pages.addEventListener("click",e=>{
    const page=e.target.closest(".page"); if(!page)return;
    if(e.target.classList.contains("mTab")){ setActiveMonth(page,e.target.dataset.ym); save(); }
    else if(e.target.classList.contains("addMonthBtn")){
      const m=+page.querySelector(".monthSel").value, y=+yearInput.value||2026;
      const blk=addMonth(page,y,m);
      if(!blk){ alert(`${y}年${m}月 はすでにあります。`); setActiveMonth(page,`${y}-${String(m).padStart(2,"0")}`); }
      else { page.dataset.activeYm=blk.dataset.ym; }
      renderMonthTabs(page); calc();
    } else if(e.target.classList.contains("delMonth")){
      if(confirm("この月の入力を削除します。よろしいですか？")){ e.target.closest(".monthBlock").remove(); renderMonthTabs(page); calc(); }
    } else if(e.target.classList.contains("delStaff")){
      const wasActive=page.classList.contains("active"); page.remove(); renderTabs();
      if(!pages.querySelector('.page[data-id^="s"]')){ createStaff(); return; }
      if(wasActive){ showPage(pages.querySelector('.page[data-id^="s"]').dataset.id); } else calc();
    } else if(e.target.matches(".seg button")){
      page.dataset.mode=e.target.dataset.k;
      page.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b===e.target));
      page.querySelector(".depField").style.opacity=e.target.dataset.k==="kou"?1:.4; calc();
    }
  });
  yearInput.addEventListener("input",calc);
  document.getElementById("addStaff").addEventListener("click",createStaff);
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("保存した入力内容をすべて消去して初期状態に戻します。よろしいですか？")){
      try{localStorage.removeItem(STORE_KEY);}catch(e){} location.reload();
    }
  });

  function createStaff(){
    const p=staffPage("スタッフ"+String.fromCharCode(64+seq+1),1300,"kou",0,0);
    const y=+yearInput.value||2026, m=new Date().getMonth()+1;
    const blk=addMonth(p,y,m); p.dataset.activeYm=blk.dataset.ym;
    renderMonthTabs(p); renderTabs(); showPage(p.dataset.id);
  }

  // ---- 初期化 ----
  function buildDemo(){
    const a=staffPage("スタッフA",1300,"kou",0,3);
    addMonth(a,2026,7,{1:{i:"10:00",o:"17:00",b:"45"},15:{i:"10:00",o:"16:00",b:"90"}});
    addMonth(a,2026,8); addMonth(a,2026,9);
    a.dataset.activeYm="2026-07"; renderMonthTabs(a);
    return a.dataset.id;
  }
  restoring=true;
  let firstId=null;
  const saved=load();
  if(saved && Array.isArray(saved.staff) && saved.staff.length){
    if(saved.year) yearInput.value=saved.year;
    saved.staff.forEach(s=>{
      const p=staffPage(s.name||"",(+s.wage||1300),(s.mode||"kou"),(+s.dep||0),(+s.pt||0));
      if(!firstId) firstId=p.dataset.id;
      (s.months||[]).forEach(mo=>{ const [y,m]=mo.ym.split("-"); addMonth(p,+y,+m,mo.days||{}); });
      p.dataset.activeYm=s.activeYm||((s.months&&s.months[0])?s.months[0].ym:"");
      renderMonthTabs(p);
    });
  } else { firstId=buildDemo(); }
  restoring=false;
  renderTabs();
  showPage((saved&&saved.active&&pages.querySelector(`.page[data-id="${saved.active}"]`))?saved.active:firstId);
</script>
</body>
</html>
